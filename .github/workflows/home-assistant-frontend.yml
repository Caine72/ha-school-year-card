name: Home Assistant frontend compatibility
on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: home-assistant-frontend-compatibility
  cancel-in-progress: true
jobs:
  smoke-test:
    runs-on: ubuntu-latest
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: 0
      HA_URL: http://127.0.0.1:8123
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with: { node-version: 24, package-manager-cache: false }
      - run: corepack enable && corepack prepare yarn@4.12.0 --activate && yarn install --immutable && yarn rollup
      - run: yarn playwright install --with-deps chromium
      - name: Resolve latest stable Home Assistant
        id: home-assistant
        env: { GH_TOKEN: "${{ github.token }}" }
        run: echo "version=$(gh api repos/home-assistant/core/releases/latest --jq .tag_name)" >> "${GITHUB_OUTPUT}"
      - name: Start Home Assistant
        run: |
          docker run --detach --name home-assistant-smoke --publish 8123:8123 "ghcr.io/home-assistant/home-assistant:${{ steps.home-assistant.outputs.version }}"
          for _ in {1..90}; do curl --fail --silent --output /dev/null "${HA_URL}/" && exit 0; sleep 2; done
          docker logs home-assistant-smoke
          exit 1
      - run: yarn test:ha-frontend
      - if: failure()
        run: docker logs home-assistant-smoke
      - if: always()
        run: docker rm --force home-assistant-smoke
