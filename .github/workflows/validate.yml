name: Validate
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  project-validation:
    runs-on: ubuntu-latest
    env: { COREPACK_ENABLE_DOWNLOAD_PROMPT: 0 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with: { node-version: 24, package-manager-cache: false }
      - run: corepack enable && corepack prepare yarn@4.12.0 --activate && yarn install --immutable
      - run: yarn validate
      - run: yarn dedupe --check
      - run: git diff --exit-code -- dist/ha-school-year-card.js
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main
        with: { category: plugin }
