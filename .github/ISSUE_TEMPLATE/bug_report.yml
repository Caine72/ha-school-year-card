name: Bug report
description: Report a reproducible School Year Card problem
title: "[Bug]: "
labels: [bug]
body:
  - type: checkboxes
    attributes:
      label: Before submitting
      options:
        - label: I am using the latest released card and School Year integration.
          required: true
        - label: I removed tokens, private URLs, entity names, and household data.
          required: true
  - type: input
    id: versions
    attributes: { label: Versions, description: "Home Assistant, card, and integration versions" }
    validations: { required: true }
  - type: textarea
    id: problem
    attributes: { label: Problem, description: "What happened and what did you expect?" }
    validations: { required: true }
  - type: textarea
    id: reproduce
    attributes: { label: Reproduction steps }
    validations: { required: true }
  - type: textarea
    id: configuration
    attributes: { label: Sanitized card configuration, render: yaml }
  - type: textarea
    id: logs
    attributes: { label: Browser console errors, render: text }
